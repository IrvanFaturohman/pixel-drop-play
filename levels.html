<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level Gallery</title>
    <style>:root{--bg:#8f8af2;--card:#3b3f9e;--ink:#fff;--muted:#c9ccfb}*{box-sizing:border-box}body{color:var(--ink);background:linear-gradient(#7f87f4,#a58af0) fixed;margin:0;font-family:Lilita One,Arial,sans-serif}header{text-align:center;padding:16px}header h1{text-shadow:0 3px #2e3190;letter-spacing:.5px;margin:0;font-size:28px}header p{color:#eef0ff;margin:6px 0 0;font-family:Arial,sans-serif;font-size:13px}#grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1200px;margin:0 auto;padding:0 16px 24px;display:grid}a.card{background:var(--card);color:inherit;border:3px solid #2e3190;border-radius:16px;flex-direction:column;padding:8px;text-decoration:none;display:flex;box-shadow:0 4px #2e3190}a.card:active{transform:translateY(2px);box-shadow:0 2px #2e3190}.top{justify-content:space-between;align-items:baseline;padding:0 2px 6px;display:flex}.top b{font-size:18px}.top span{color:var(--muted);font-family:Arial,sans-serif;font-size:11px}canvas{aspect-ratio:1;background:#5157c4;border-radius:10px;width:100%;display:block}.meta{color:var(--muted);padding:6px 2px 0;font-family:Arial,sans-serif;font-size:11px;line-height:1.35}.chips{flex-wrap:wrap;gap:4px;padding-top:5px;display:flex}.chip{background:#2e3190;border-radius:99px;align-items:center;gap:3px;padding:2px 6px 2px 3px;font-family:Arial,sans-serif;font-size:11px;display:inline-flex}.dot{border:1px solid #0004;border-radius:50%;width:10px;height:10px}.tag{background:#ef3b55;border-radius:6px;margin-left:4px;padding:1px 5px;font-family:Arial,sans-serif;font-size:10px}.card.demo{outline:3px solid #ffd84a;box-shadow:0 0 18px #ffd84a80}</style>
    <script type="module" crossorigin src="./assets/levels-BKgcHug7.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/sandmode-tT_jzs0r.js">
    <link rel="stylesheet" crossorigin href="./assets/sandmode-AEiAlQEH.css">
  </head>
  <body>
    <header>
      <h1>Level Gallery</h1>
      <p>★ = levels made for the sand mode · 51 levels from the Picky Pixels data · tap a level to play it · chips = cups per colour</p>
    </header>
    <div id="grid"></div>
  </body>
</html>
